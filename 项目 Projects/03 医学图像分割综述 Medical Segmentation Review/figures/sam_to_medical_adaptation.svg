<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
 <title id="title">SAM to medical adaptation map</title><desc id="desc">Original conceptual map showing natural-image pretraining, domain shift, adaptation choices, and medical application contexts.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334e68"/></marker></defs>
 <rect width="1200" height="500" fill="#fbfcfe"/><text x="70" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102a43">From natural-image pretraining to medical use</text><text x="70" y="96" font-family="Arial, sans-serif" font-size="16" fill="#486581">Original concept map: adaptation choice follows task, data access, and evaluation design</text>
 <g font-family="Arial, sans-serif"><rect x="70" y="175" width="220" height="155" rx="18" fill="#e4eef7" stroke="#2b6b92" stroke-width="2"/><text x="180" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#12344d">Natural-image</text><text x="180" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#12344d">pretraining</text><text x="180" y="280" text-anchor="middle" font-size="15" fill="#486581">SAM representation + prompts</text>
 <line x1="300" y1="253" x2="405" y2="253" stroke="#334e68" stroke-width="3" marker-end="url(#a)"/><rect x="415" y="150" width="260" height="205" rx="18" fill="#fff3cd" stroke="#b7791f" stroke-width="2"/><text x="545" y="195" text-anchor="middle" font-size="23" font-weight="700" fill="#744210">Domain shift</text><text x="545" y="230" text-anchor="middle" font-size="15" fill="#744210">modality · scale · 2D/3D</text><text x="545" y="257" text-anchor="middle" font-size="15" fill="#744210">contrast · scanner/stain</text><text x="545" y="284" text-anchor="middle" font-size="15" fill="#744210">annotation ambiguity</text>
 <line x1="685" y1="253" x2="765" y2="253" stroke="#334e68" stroke-width="3" marker-end="url(#a)"/><rect x="775" y="115" width="235" height="275" rx="18" fill="#e8ddf8" stroke="#805ad5" stroke-width="2"/><text x="893" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#553c9a">Response options</text><text x="893" y="200" text-anchor="middle" font-size="16" fill="#553c9a">prompt design</text><text x="893" y="232" text-anchor="middle" font-size="16" fill="#553c9a">full fine-tuning</text><text x="893" y="264" text-anchor="middle" font-size="16" fill="#553c9a">adapters / prompts</text><text x="893" y="296" text-anchor="middle" font-size="16" fill="#553c9a">domain adaptation</text><text x="893" y="328" text-anchor="middle" font-size="16" fill="#553c9a">domain generalization</text>
 <line x1="1020" y1="253" x2="1090" y2="253" stroke="#334e68" stroke-width="3" marker-end="url(#a)"/><text x="1100" y="211" font-size="19" font-weight="700" fill="#102a43">Use contexts</text><text x="1100" y="243" font-size="15" fill="#486581">digital pathology</text><text x="1100" y="269" font-size="15" fill="#486581">radiology</text><text x="1100" y="295" font-size="15" fill="#486581">multi-modal imaging</text></g>
 <text x="70" y="445" font-family="Arial, sans-serif" font-size="15" fill="#627d98">Prompting, parameter updates, and generalization targets are distinct intervention points.</text>
