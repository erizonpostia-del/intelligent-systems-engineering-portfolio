<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Medical segmentation model landscape</title><desc id="desc">An original conceptual progression from task-specific segmentation to medical adaptation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f3b59"/></marker></defs>
  <rect width="1200" height="420" fill="#f7fafc"/><text x="70" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102a43">A changing segmentation workflow</text>
  <text x="70" y="98" font-family="Arial, sans-serif" font-size="16" fill="#486581">Conceptual landscape — not a performance ranking</text>
  <g font-family="Arial, sans-serif"><rect x="65" y="160" width="180" height="130" rx="16" fill="#d9eaf7" stroke="#2b6b92" stroke-width="2"/><text x="155" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#12344d">Task-specific</text><text x="155" y="233" text-anchor="middle" font-size="18" fill="#243b53">U-Net</text><text x="155" y="258" text-anchor="middle" font-size="14" fill="#486581">data + labels define task</text>
  <line x1="255" y1="225" x2="320" y2="225" stroke="#1f3b59" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="160" width="180" height="130" rx="16" fill="#dff3ea" stroke="#23835b" stroke-width="2"/><text x="420" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#164e36">Automated setup</text><text x="420" y="233" text-anchor="middle" font-size="18" fill="#164e36">nnU-Net</text><text x="420" y="258" text-anchor="middle" font-size="14" fill="#486581">configuration follows data</text>
  <line x1="520" y1="225" x2="585" y2="225" stroke="#1f3b59" stroke-width="3" marker-end="url(#arrow)"/><rect x="595" y="160" width="180" height="130" rx="16" fill="#f8edcf" stroke="#b7791f" stroke-width="2"/><text x="685" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#744210">Transformer</text><text x="685" y="233" text-anchor="middle" font-size="18" fill="#744210">TransUNet</text><text x="685" y="258" text-anchor="middle" font-size="14" fill="#486581">global + local context</text>
  <line x1="785" y1="225" x2="850" y2="225" stroke="#1f3b59" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="160" width="180" height="130" rx="16" fill="#eadcf8" stroke="#805ad5" stroke-width="2"/><text x="950" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#553c9a">Foundation model</text><text x="950" y="233" text-anchor="middle" font-size="18" fill="#553c9a">SAM</text><text x="950" y="258" text-anchor="middle" font-size="14" fill="#486581">prompt specifies target</text>
  <line x1="1050" y1="225" x2="1115" y2="225" stroke="#1f3b59" stroke-width="3" marker-end="url(#arrow)"/><text x="1125" y="205" font-size="18" font-weight="700" fill="#102a43">Medical</text><text x="1125" y="231" font-size="18" font-weight="700" fill="#102a43">adaptation</text><text x="1125" y="257" font-size="14" fill="#486581">SAM-Path · MedSAM</text></g>
  <text x="70" y="360" font-family="Arial, sans-serif" font-size="15" fill="#627d98">Each step changes the modeling workflow; none supplies a universal cross-dataset ranking.</text>
</svg>
