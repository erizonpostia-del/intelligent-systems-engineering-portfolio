<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
 <title id="title">Evaluation metric map</title><desc id="desc">Original schematic showing complementary dimensions of medical segmentation evaluation.</desc><rect width="1200" height="500" fill="#f8fafc"/><text x="70" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102a43">A metric is a lens, not a verdict</text><text x="70" y="96" font-family="Arial, sans-serif" font-size="16" fill="#486581">Use complementary measures and state the evaluation protocol</text>
 <g font-family="Arial, sans-serif"><circle cx="600" cy="255" r="98" fill="#d9eaf7" stroke="#2b6b92" stroke-width="3"/><text x="600" y="245" text-anchor="middle" font-size="24" font-weight="700" fill="#12344d">Segmentation</text><text x="600" y="276" text-anchor="middle" font-size="24" font-weight="700" fill="#12344d">evaluation</text>
 <rect x="90" y="155" width="230" height="115" rx="16" fill="#e3f5ec" stroke="#23835b" stroke-width="2"/><text x="205" y="198" text-anchor="middle" font-size="21" font-weight="700" fill="#164e36">Overlap</text><text x="205" y="228" text-anchor="middle" font-size="16" fill="#164e36">Dice · IoU</text><line x1="320" y1="215" x2="495" y2="240" stroke="#334e68" stroke-width="3"/>
 <rect x="90" y="325" width="230" height="115" rx="16" fill="#fff3cd" stroke="#b7791f" stroke-width="2"/><text x="205" y="368" text-anchor="middle" font-size="21" font-weight="700" fill="#744210">Detection balance</text><text x="205" y="398" text-anchor="middle" font-size="16" fill="#744210">precision · recall</text><line x1="320" y1="380" x2="500" y2="290" stroke="#334e68" stroke-width="3"/>
 <rect x="880" y="155" width="230" height="115" rx="16" fill="#eadcf8" stroke="#805ad5" stroke-width="2"/><text x="995" y="198" text-anchor="middle" font-size="21" font-weight="700" fill="#553c9a">Boundary</text><text x="995" y="228" text-anchor="middle" font-size="16" fill="#553c9a">HD · HD95 · ASSD</text><line x1="880" y1="215" x2="705" y2="240" stroke="#334e68" stroke-width="3"/>
 <rect x="880" y="325" width="230" height="115" rx="16" fill="#dcecf9" stroke="#2b6b92" stroke-width="2"/><text x="995" y="362" text-anchor="middle" font-size="21" font-weight="700" fill="#12344d">Deployment context</text><text x="995" y="392" text-anchor="middle" font-size="16" fill="#12344d">robustness · efficiency</text><line x1="880" y1="380" x2="705" y2="290" stroke="#334e68" stroke-width="3"/></g>
 <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#627d98">Always report: unit, 2D/3D, prompt protocol, empty-mask rule, aggregation, and external-validation status.</text>
</svg>
